<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Outliner</title>
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Set the theme before first paint so the page never flashes the wrong colours.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('outliner.theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      // On a narrow screen the sidebar always starts closed; elsewhere it follows the saved choice.
      var narrow = matchMedia('(max-width: 700px)').matches;
      try { if (narrow || localStorage.getItem('outliner.sidebar') === 'hidden') document.documentElement.dataset.sidebar = 'hidden'; } catch (e) {}
    })();
  </script>
</head>
<body>
  <aside id="sidebar">
    <input id="search" type="search" placeholder="Filter…" title="Words, #tag or status:planned — combine freely" autocomplete="off" spellcheck="false">

    <section>
      <h2>Status</h2>
      <ul id="status-list" class="facet-list"></ul>
    </section>

    <section>
      <h2>Releases</h2>
      <ul id="release-list" class="facet-list"></ul>
    </section>

    <section>
      <h2>People</h2>
      <ul id="people-list" class="facet-list"></ul>
    </section>

    <section>
      <h2>Tags</h2>
      <ul id="tag-list" class="facet-list"></ul>
    </section>

    <section class="shortcuts">
      <h2>Keys</h2>
      <dl id="shortcut-list"></dl>
    </section>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="sidebar-toggle" class="icon-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <nav id="view-switch">
        <a href="#/" data-view="outline">Outline</a>
        <a href="#/releases" data-view="releases">Releases</a>
      </nav>
      <nav id="breadcrumb"></nav>
      <button id="scratch-toggle" type="button" title="Scratch pad — c to capture, ` to switch">Scratch <span class="n">0</span></button>
      <span id="mode-badge" data-mode="navigate">Navigate</span>
      <span id="save-state"></span>
      <button id="theme-toggle" class="icon-button" type="button" title="Switch light / dark">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <h1 id="title" contenteditable="plaintext-only" spellcheck="false"></h1>
    <ul id="tree" class="children root"></ul>
    <button id="add-item" type="button">+ Add item</button>
    <div id="releases"></div>
  </main>

  <aside id="scratch">
    <header class="scratch-head">
      <h2>Scratch pad</h2>
      <span id="scratch-count"></span>
      <button id="scratch-close" class="icon-button" type="button" title="Close">×</button>
    </header>
    <input id="scratch-input" type="text" placeholder="Jot something…  ↵" autocomplete="off" spellcheck="false">
    <ul id="scratch-list"></ul>
  </aside>

  <div id="status-menu" class="popover" hidden></div>
  <div id="field-menu" class="popover" hidden></div>
  <div id="link-menu" class="popover" hidden></div>
  <div id="move-menu" class="popover" hidden></div>
  <div id="drop-indicator" hidden></div>
  <div id="keybar" hidden></div>
  <div id="help" hidden></div>

  <script src="app.js"></script>
</body>
</html>
